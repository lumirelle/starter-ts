name: CI Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  coverage:
    uses: lumirelle/workflows/.github/workflows/ci-coverage.yml@v11
    permissions:
      id-token: write
    with:
      # Oxlint's JS-plugin allocator reserves ~6 GiB; ubuntu-slim has only ~2.5 GiB of commit.
      primary-os: ubuntu-latest
      cache-preset: nub
